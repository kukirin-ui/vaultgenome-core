# AI Continuity Platform — Performance Regression CI
#
# Runs Go benchmarks on every PR + pushes to main. Compares the PR's
# benchmark numbers against the main-branch baseline using benchstat;
# the report goes to the job summary and the run's artifact, and, for a
# pull request from this repository, to a sticky comment on the PR.
#
# Why this exists: a single dropped sync.Mutex.RLock on a hot path can
# make attestation 5x slower without breaking any unit test. The
# vault-gate doctrine catches correctness regressions; this workflow
# catches performance regressions.

name: bench

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # for the comparison comment

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout PR / push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: go.sum

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e

      - name: Benchmark current ref
        run: |
          mkdir -p dist
          # 5 counts so benchstat has enough samples to compute t-test.
          # 1s benchtime per benchmark — bounded to ~10 minutes total
          # for the current set of benchmarks.
          go test -bench=. -benchmem -run=^$ -count=5 -benchtime=1s ./... | tee dist/bench-current.out

      - name: Benchmark main branch baseline
        if: github.event_name == 'pull_request'
        run: |
          # Fetch the merge-base so we benchmark the exact commit the
          # PR diverged from. Avoids comparing against an unrelated
          # main commit if main has moved.
          git fetch origin main:main
          git checkout main
          go test -bench=. -benchmem -run=^$ -count=5 -benchtime=1s ./... | tee dist/bench-baseline.out
          git checkout -

      - name: Compare benchmarks (PR only)
        if: github.event_name == 'pull_request'
        id: benchstat
        run: |
          benchstat dist/bench-baseline.out dist/bench-current.out | tee dist/benchstat.out
          # Capture the human-readable summary for the PR comment.
          {
            echo 'comment<<COMMENT_EOF'
            echo '## Performance Regression Report'
            echo
            echo 'Comparison of this PR against the merge-base on `main`:'
            echo
            echo '```'
            cat dist/benchstat.out
            echo '```'
            echo
            echo 'Generated by `.github/workflows/bench.yml`. A regression is statistically'
            echo 'significant when benchstat marks a row with ~p ≤ 0.05.'
            echo 'COMMENT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Write the report to the job summary
        if: github.event_name == 'pull_request'
        run: printf '%s\n' "$REPORT" >> "$GITHUB_STEP_SUMMARY"
        env:
          REPORT: ${{ steps.benchstat.outputs.comment }}

      # A pull request from a fork runs with a read-only token, so the
      # sticky comment cannot be posted there; the summary above and the
      # artifact below carry the same report for every pull request.
      - name: Post comparison comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: bench-regression-report
          message: ${{ steps.benchstat.outputs.comment }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ github.sha }}
          path: |
            dist/bench-current.out
            dist/bench-baseline.out
            dist/benchstat.out
          if-no-files-found: ignore
